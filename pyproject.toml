[project]
name = "motor"
version = "0.1.0"
description = "Motor de recompensas WydenCoin: lê a planilha de indicadores, aplica as regras e envia as emissões à API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "requests>=2.32",
]

[project.scripts]
motor = "motor.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "dados_exemplo"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PT",
    "RUF",
    "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PT011"]
"dados_exemplo/gerar.py" = ["S311"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]
